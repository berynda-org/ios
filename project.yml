name: Berynda
options:
  bundleIdPrefix: org.berynda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.4"

packages:
  BeryndaCore:
    path: BeryndaCore
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: KHMPLP3CXQ
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  Berynda:
    type: application
    platform: iOS
    sources:
      - path: Berynda
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: BeryndaCore
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    info:
      path: Berynda/Info.plist
      properties:
        CFBundleDevelopmentRegion: uk
        CFBundleDisplayName: Берында
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: org.berynda.ios
            CFBundleURLSchemes:
              - berynda
        LSApplicationCategoryType: public.app-category.books
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: org.berynda.ios
        PRODUCT_NAME: Berynda
        # Only the app consumes the CI profile; Swift package resource bundles
        # do not support provisioning profiles.
        PROVISIONING_PROFILE_SPECIFIER: "$(BERYNDA_PROFILE_SPECIFIER)"
    entitlements:
      path: Berynda/Berynda.entitlements

  BeryndaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeryndaTests
    dependencies:
      - target: Berynda
      - package: BeryndaCore
      # Explicit rather than relying on the app target's copy leaking through,
      # so the publication TOC logic can be unit tested.
      - package: Readium
        product: ReadiumShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.berynda.ios.tests
        GENERATE_INFOPLIST_FILE: true

  BeryndaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BeryndaUITests
    dependencies:
      - target: Berynda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.berynda.ios.uitests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Berynda:
    build:
      targets:
        Berynda: all
        BeryndaTests: [test]
        BeryndaUITests: [test]
    test:
      targets:
        - BeryndaTests
        - BeryndaUITests
      gatherCoverageData: true
