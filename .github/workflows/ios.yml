name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Test upload result handling
        run: python3 -m unittest discover -s .github/scripts -p test_upload_testflight.py
      # App Store Connect rejects uploads built with anything older than
      # Xcode 26 and the iOS 26 SDK (Apple requirement since 2026-04-28).
      # Pinned rather than "latest": this macos-15 image ships Xcode 26.3
      # with an "iPhone 16 Pro" simulator on iOS 26.2, which the test
      # destinations below name; the macos-26 image has no such simulator.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test core package
        run: swift test --package-path BeryndaCore
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build app and tests without signing
        run: >-
          xcodebuild
          -project Berynda.xcodeproj
          -scheme Berynda
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Run app unit tests
        run: >-
          xcodebuild
          -project Berynda.xcodeproj
          -scheme Berynda
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          -only-testing:BeryndaTests
          CODE_SIGNING_ALLOWED=NO
          test-without-building
      - name: Run deterministic alpha UI journeys
        run: >-
          xcodebuild
          -project Berynda.xcodeproj
          -scheme Berynda
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          -only-testing:BeryndaUITests
          CODE_SIGNING_ALLOWED=NO
          test-without-building
